# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4
version: "v0.4"

project:
  name: "mason-flats"
  description: >-
    Lean 4 / Mathlib certificate that Mason’s 1972 conjecture on log-concavity
    of Whitney numbers of the second kind is false: Larson’s rank-76 dual of
    the rank-3 parallel extension of U_{3,4} with parallel classes of sizes
    1, 26, 26, 26 satisfies W_74^2 < W_73 W_75. Flats are counted as cyclic
    sets in the dual; the closed forms are binomial identities. White’s
    conjecture from the same paper is not compared.
  authors:
    - "Dan Clemens Posch"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Clemens Posch"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05B35", "05C31"]

sources:
  - title: "Counterexamples to two conjectures about matroids"
    authors:
      - "Matt Larson"
    id: "arXiv:2607.02208"
    type: "article"
    location: "arXiv:2607.02208, 2026"
    relationship: "independently-proves"
    note: >-
      Formalizes Example 2.2 / Theorem 2.3: the rank-76 graphic matroid of a
      generalized theta graph with path lengths 26, 26, 26, 1, via Larson’s
      dual cyclic-set count. Does not formalize White’s conjecture.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Matroids: unimodal conjectures and Motzkin’s theorem"
    authors:
      - "John H. Mason"
    type: "article"
    location: "Combinatorics (Proc. Conf. Combinatorial Math., Math. Inst., Oxford, 1972), pp. 207–220"
    relationship: "background"
    note: "The 1972 conjecture that Whitney numbers of the second kind are log-concave."
    license: "unknown"
    author_endorsement: "n/a"

related_formalizations: []

status:
  scope: >-
    Compared: MasonFlats.mason_log_concave_false, existence of a rank-76
    matroid on 79 elements with W_74^2 < W_73 W_75. Not compared: White’s
    conjecture, unimodality of Whitney numbers, or ultra-log-concavity.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["grok-4.6"]
      framework: "Grok Build TUI"
      tool_setup: "AI-assisted Lean 4 with Mathlib v4.32.0; local lake verify"
      cost:
        wall_time: "one session"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Larson dual cyclic-set count; no native_decide"
  spend_usd: "not tracked"
  notes: >-
    Palomar certificate of Larson’s counterexample. Cyclic-set classification
    on the rank-3 dual plus binomial arithmetic; no enumeration of rank-76 flats.

fidelity:
  divergences: >-
    The compared matroid is constructed as the dual of an explicit rank-3
    parallel extension of U_{3,4} on Fin 79, which is the dual of the graphic
    matroid of Larson’s generalized theta graph. Graphic-matroid API is not
    used; the dual identification of Whitney numbers with cyclic-set counts
    is proved.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: "Statement surface follows Larson Theorem 2.3: W_74^2 < W_73 W_75."

alignment:
  namespace: "MasonFlats"
  statements:
    - source: "Larson, Theorem 2.3 / Example 2.2"
      lean: "MasonFlats.mason_log_concave_false"
      module: "Challenge"
      status: "proved"
      note: >-
        Rank-76 matroid on 79 elements with W_74^2 < W_73 W_75, via dual
        cyclic-set counts.

acknowledgements: >-
  Mathlib; Larson arXiv:2607.02208; Mason 1972; Palomar template.
